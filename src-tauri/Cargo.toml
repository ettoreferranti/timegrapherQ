[package]
name = "timegrapherq"
version = "0.1.0"
description = "TimegrapherQ — a software timegrapher for mechanical watches."
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows.
name = "timegrapherq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
# Audio file import: WAV/FLAC/OGG by default, plus AAC-in-MP4 (phone voice
# memos), MP3 and AIFF.
symphonia = { version = "0.6", features = ["aac", "isomp4", "mp3", "aiff"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "macros"] }
timegrapherq-core = { path = "../core" }
